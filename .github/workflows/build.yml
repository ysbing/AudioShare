name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  JAVA_VERSION: '21'

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Android server
        run: .\gradlew.bat :server:assembleRelease --no-daemon

      - name: Prepare Flutter project
        working-directory: client
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos

      - name: Build Windows client
        working-directory: client
        run: flutter build windows --release

      - name: Package Windows build
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            (Select-String -Path client/pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+').Matches[0].Groups[1].Value
          }
          if (-not $version) { throw 'Could not determine the version.' }
          Write-Host "Packaging $version"
          ./tools/package_windows.ps1 -Version $version

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: audioshare-windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # The runner has no Apple Developer certificate, so build without signing
      # and ad-hoc sign the bundle in tools/package_macos.sh instead.
      FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
      FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
      FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'
      FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Android server
        run: ./gradlew :server:assembleRelease --no-daemon

      - name: Prepare Flutter project
        working-directory: client
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos

      - name: Build macOS client
        working-directory: client
        run: flutter build macos --release

      - name: Package macOS build
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\)+.*/\1/p' client/pubspec.yaml | head -n 1)"
          fi
          if [ -z "$version" ]; then
            echo "Could not determine the version." >&2
            exit 1
          fi
          echo "Packaging $version"
          ./tools/package_macos.sh --version "$version"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: audioshare-macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach packages to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
