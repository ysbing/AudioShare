name: audioshare
description: Stream system audio (Windows/macOS) to Android via ADB.
publish_to: none

version: 2.2.2+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.0
  flutter_screenutil: ^5.9.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.18.0

flutter:
  generate: true
  uses-material-design: true

# Microsoft Store packaging (tools/package_store.ps1). identity_name and
# publisher must match the values on the product's Identity page in Partner
# Center; the packaging script refuses to run while they are placeholders.
msix_config:
  display_name: AudioShare
  publisher_display_name: ysbing
  identity_name: ysbing.AudioShare
  publisher: CN=928CDDD4-FB48-4610-8DFF-FD7336ABEB2F
  logo_path: ../tools/logo.png
  languages: en-us, zh-cn, zh-tw, es-es, pt-br, ru-ru, ja-jp, ko-kr, de-de, fr-fr, it-it, hi-in, ar-sa, tr-tr, vi-vn, id-id, pl-pl, th-th, nl-nl, sv-se, cs-cz, he-il, uk-ua, ro-ro, hu-hu, da-dk, fi-fi, el-gr
  store: true
